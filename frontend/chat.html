<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da1Help. — Mensagens</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .chat-layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar conversas */
        .chat-sidebar {
            width: 300px; border-right: 1px solid var(--gray-200);
            display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
        }
        body.dark-mode .chat-sidebar { border-color: rgba(255,255,255,.08); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--gray-200); font-weight: 700; font-size: 1rem; }
        body.dark-mode .sidebar-header { border-color: rgba(255,255,255,.08); }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px; cursor: pointer; border-bottom: 1px solid var(--gray-100);
            transition: var(--transition);
        }
        .chat-item:hover, .chat-item.active { background: var(--brand-blue-lt); }
        body.dark-mode .chat-item { border-color: rgba(255,255,255,.04); }
        body.dark-mode .chat-item:hover, body.dark-mode .chat-item.active { background: rgba(29,78,216,.15); }
        .chat-item-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .chat-item-name  { font-weight: 700; font-size: .9rem; }
        .chat-item-preview { font-size: .78rem; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Área de mensagens */
        .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header {
            padding: 16px 24px; border-bottom: 1px solid var(--gray-200);
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,.7); backdrop-filter: blur(12px);
        }
        body.dark-mode .chat-header { background: rgba(26,26,46,.7); border-color: rgba(255,255,255,.08); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }

        /* Bolhas */
        .msg-row { display: flex; gap: 10px; max-width: 75%; }
        .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; align-self: flex-end; }
        .msg-bubble {
            padding: 12px 16px; border-radius: 18px;
            font-size: .9rem; line-height: 1.5; max-width: 100%;
            background: var(--gray-100); color: var(--gray-900);
        }
        .msg-row.mine .msg-bubble { background: var(--brand-blue); color: #fff; border-bottom-right-radius: 4px; }
        .msg-row:not(.mine) .msg-bubble { border-bottom-left-radius: 4px; }
        .msg-time { font-size: .72rem; color: var(--gray-400); margin-top: 4px; }
        .msg-row.mine .msg-time { text-align: right; }

        /* Input */
        .chat-input-area {
            padding: 16px 20px; border-top: 1px solid var(--gray-200);
            display: flex; gap: 10px; align-items: flex-end;
            background: rgba(255,255,255,.7); backdrop-filter: blur(12px);
        }
        body.dark-mode .chat-input-area { background: rgba(26,26,46,.7); border-color: rgba(255,255,255,.08); }
        .chat-input {
            flex: 1; padding: 12px 18px; border-radius: 999px;
            border: 1.5px solid var(--gray-200); background: var(--gray-50);
            font-size: .93rem; outline: none; resize: none; max-height: 120px;
            font-family: inherit; color: var(--gray-900);
            transition: var(--transition);
        }
        .chat-input:focus { border-color: var(--brand-blue); background: #fff; }
        .btn-send {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--brand-blue); color: #fff; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: var(--transition); flex-shrink: 0;
        }
        .btn-send:hover { background: var(--brand-blue-mid); transform: scale(1.05); }

        /* Empty */
        .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; }
        .chat-empty-inner { text-align: center; color: var(--gray-400); }
        .chat-empty-inner .icon { font-size: 3.5rem; margin-bottom: 16px; }

        @media (max-width: 640px) {
            .chat-sidebar { width: 72px; }
            .chat-item-name, .chat-item-preview { display: none; }
            .chat-item { justify-content: center; padding: 10px 4px; }
            .chat-item-avatar { width: 40px; height: 40px; }
        }
        @media (max-width: 400px) {
            .chat-sidebar { width: 52px; }
            .chat-item-avatar { width: 34px; height: 34px; }
            .msg-bubble { font-size: .82rem; padding: 8px 10px; }
            .chat-input { font-size: .85rem; }
        }
    </style>
</head>
<body>
    <header class="glass-header" style="flex-shrink:0">
        <div class="nav-container">
            <a href="homepage.html" class="logo">Da1Help<span>.</span></a>
            <div style="display:flex;align-items:center;gap:14px">
                <button onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
                <nav class="user-menu"></nav>
            </div>
        </div>
    </header>

    <div class="chat-layout">
        <aside class="chat-sidebar">
            <div class="sidebar-header">💬 Mensagens</div>
            <div class="chat-list" id="chat-list">
                <div style="padding:30px;text-align:center;color:var(--gray-400);font-size:.88rem">Nenhuma conversa</div>
            </div>
        </aside>

        <div class="chat-main" id="chat-main">
            <div class="chat-empty" id="chat-empty">
                <div class="chat-empty-inner">
                    <div class="icon">💬</div>
                    <p>Selecione uma conversa<br>ou inicie uma nova pelo perfil<br>de um profissional.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="main.js"></script>
    <script>
        if (!Session.isLoggedIn()) window.location.href = 'loginpage.html';

        const myUser   = Session.getUser();
        const urlId    = new URLSearchParams(window.location.search).get('id');
        let   destId   = urlId || null;
        let   destInfo = null;
        let   pooling  = null;
        let   _lastMsgCount = 0;
        let   _lastMsgId    = null;
        let   _sending      = false;

        // ─── Abre conversa ────────────────────────────────────────────────────
        async function abrirConversa(userId, nome, avatarUrl) {
            destId   = userId;
            destInfo = { nome, avatarUrl };
            _lastMsgCount = 0;
            _lastMsgId    = null;

            document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
            const item = document.getElementById(`chat-item-${userId}`);
            if (item) item.classList.add('active');

            const main = document.getElementById('chat-main');
            main.innerHTML = `
                <div class="chat-header">
                    <img src="${avatarUrl}" alt="" style="width:38px;height:38px;border-radius:50%;object-fit:cover">
                    <div>
                        <div style="font-weight:700;font-size:.95rem">${nome}</div>
                        <div style="font-size:.75rem;color:var(--gray-400)">Profissional Da1Help</div>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <textarea id="chat-input" class="chat-input" rows="1" placeholder="Digite uma mensagem..."></textarea>
                    <button id="btn-send" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            `;

            document.getElementById('btn-send').addEventListener('click', enviarMsg);
            document.getElementById('chat-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMsg(); }
            });

            // Auto-resize textarea
            document.getElementById('chat-input').addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            await carregarHistorico();
            clearInterval(pooling);
            // Polling de 2s enquanto o chat está aberto
            pooling = setInterval(async () => {
                await carregarHistorico(false); // false = não forçar scroll se já estava no topo
            }, 2000);
        }

        async function carregarHistorico(forceScroll = true) {
            if (!destId) return;
            try {
                const data = await API.messages.getHistorico(destId);
                const msgs = data.mensagens || [];

                // Só re-renderiza se houve mudança (evita flash desnecessário)
                const newLastId = msgs.length ? msgs[msgs.length - 1]._id : null;
                if (!forceScroll && newLastId === _lastMsgId && msgs.length === _lastMsgCount) return;

                const hadChange = msgs.length !== _lastMsgCount;
                _lastMsgCount = msgs.length;
                _lastMsgId    = newLastId;

                renderMensagens(msgs, forceScroll || hadChange);

                // Atualiza lista de conversas se chegou mensagem nova
                if (hadChange) {
                    carregarConversas(false);
                    atualizarBadgeNaoLidas();
                }
            } catch (_) {}
        }

        function renderMensagens(msgs, scrollDown = true) {
            const container = document.getElementById('chat-messages');
            if (!container) return;

            const scrollAtBottom =
                container.scrollHeight - container.scrollTop <= container.clientHeight + 80;

            container.innerHTML = msgs.map(m => {
                const remId  = m.remetenteId?._id?.toString() || m.remetenteId?.toString();
                const isMine = remId === myUser._id;
                const avatar = isMine
                    ? `https://ui-avatars.com/api/?name=${encodeURIComponent(myUser.nome)}&background=1d4ed8&color=fff&bold=true`
                    : (destInfo?.avatarUrl || `https://ui-avatars.com/api/?name=P&background=7c3aed&color=fff`);
                const hora = new Date(m.createdAt).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
                return `
                    <div class="msg-row ${isMine ? 'mine' : ''}">
                        <img src="${avatar}" alt="" class="msg-avatar">
                        <div>
                            <div class="msg-bubble">${escapeHtml(m.texto)}</div>
                            <div class="msg-time">${hora}</div>
                        </div>
                    </div>`;
            }).join('') || `<div style="text-align:center;color:var(--gray-400);padding:30px;font-size:.88rem">Sem mensagens. Diga olá! 👋</div>`;

            if (scrollDown && (scrollAtBottom || _lastMsgCount <= 1)) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function appendMensagemOtimista(texto) {
            const container = document.getElementById('chat-messages');
            if (!container) return;
            // Remove placeholder vazio se existir
            const placeholder = container.querySelector('[data-empty]');
            if (placeholder) placeholder.remove();

            const hora = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
            const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(myUser.nome)}&background=1d4ed8&color=fff&bold=true`;
            const div = document.createElement('div');
            div.className = 'msg-row mine';
            div.dataset.optimistic = 'true';
            div.innerHTML = `
                <img src="${avatar}" alt="" class="msg-avatar">
                <div>
                    <div class="msg-bubble">${escapeHtml(texto)}</div>
                    <div class="msg-time">${hora} <span style="opacity:.5;font-size:.68rem">enviando...</span></div>
                </div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function enviarMsg() {
            if (_sending) return;
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (!texto || !destId) return;

            _sending = true;
            input.value = '';
            input.style.height = 'auto';
            input.disabled = true;

            // Mostra a mensagem imediatamente (UI otimista)
            appendMensagemOtimista(texto);

            try {
                await API.messages.enviar({ destinatarioId: destId, texto });
                // Remove otimistas e carrega do servidor (com dados reais/id)
                await carregarHistorico(false);
            } catch (err) {
                Toast.error(err.message || 'Erro ao enviar mensagem.');
                input.value = texto; // restaura
            } finally {
                _sending = false;
                input.disabled = false;
                input.focus();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ─── Carrega lista de conversas ───────────────────────────────────────
        async function carregarConversas(autoAbrir = true) {
            try {
                const data = await API.messages.getConversas();
                const list = document.getElementById('chat-list');

                if (!data.conversas.length && !urlId) {
                    list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--gray-400);font-size:.85rem">Nenhuma conversa ainda.<br>Acesse o perfil de um profissional para iniciar.</div>`;
                    if (autoAbrir && urlId) autoAbrirConversa();
                    return;
                }

                // Novo formato: {parceiro:{nome,fotoUrl}, ultimaMensagem, naoLidas}
                list.innerHTML = data.conversas.map(c => {
                    const parceiro   = c.parceiro || {};
                    const nome       = parceiro.nome || 'Usuário';
                    const id         = parceiro._id;
                    const avatar     = parceiro.fotoUrl && !parceiro.fotoUrl.includes('Default')
                        ? parceiro.fotoUrl
                        : `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=7c3aed&color=fff&bold=true`;
                    const preview    = escapeHtml(c.ultimaMensagem?.texto?.substring(0, 40) || '');
                    const naoLidas   = c.naoLidas || 0;
                    const isActive   = destId === id?.toString() ? 'active' : '';
                    return `
                        <div class="chat-item ${isActive}" id="chat-item-${id}" onclick="abrirConversa('${id}', '${nome.replace(/'/g,"\\'")}', '${avatar}')">
                            <img src="${avatar}" alt="" class="chat-item-avatar">
                            <div style="flex:1;min-width:0">
                                <div class="chat-item-name" style="display:flex;align-items:center;gap:6px">
                                    ${nome}
                                    ${naoLidas > 0 ? `<span style="background:var(--brand-blue);color:#fff;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:20px">${naoLidas}</span>` : ''}
                                </div>
                                <div class="chat-item-preview">${preview}</div>
                            </div>
                        </div>`;
                }).join('');

                if (autoAbrir) autoAbrirConversa();
            } catch (_) {}
        }

        function autoAbrirConversa() {
            if (!urlId) return;
            // Tenta achar o parceiro nos dados carregados
            const item = document.getElementById(`chat-item-${urlId}`);
            if (item) {
                item.click();
            } else {
                // Abre direto mesmo sem estar na lista
                const avatar = `https://ui-avatars.com/api/?name=P&background=7c3aed&color=fff&bold=true`;
                abrirConversa(urlId, 'Profissional', avatar);
            }
        }

        // Polling de não lidas a cada 10s para atualizar badge do header
        async function atualizarBadgeNaoLidas() {
            try {
                const data  = await API.messages.getNaoLidas();
                const badge = document.getElementById('badge-msgs');
                if (badge) badge.textContent = data.total > 0 ? data.total : '';
                if (badge) badge.style.display = data.total > 0 ? 'inline' : 'none';
            } catch (_) {}
        }

        carregarConversas();
        atualizarBadgeNaoLidas();
        setInterval(atualizarBadgeNaoLidas, 10000);

        // Limpa polling ao sair da página
        window.addEventListener('beforeunload', () => clearInterval(pooling));

    </script>
</body>
</html>
