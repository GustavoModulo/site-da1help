<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da1Help. — Contato</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="contatopage.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="glass-header">
        <div class="nav-container">
            <a href="homepage.html" class="logo">Da1Help<span>.</span></a>
            <div style="display:flex;align-items:center;gap:14px">
                <button onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
                <nav class="user-menu"></nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header">
            <h1>Fale <span class="text-gradient">Conosco</span></h1>
            <p>Tem alguma dúvida ou sugestão? Escolha um canal e mande uma mensagem.</p>
        </div>

        <div class="info-grid">
            <div class="glass-card contact-card">
                <div class="icon">📱</div>
                <h3>WhatsApp</h3>
                <p>(16) 99999-9999</p>
                <span class="sub-text">Seg a Sex, 9h às 18h</span>
            </div>

            <div class="glass-card contact-card">
                <div class="icon">📧</div>
                <h3>E-mail</h3>
                <p>contato@da1help.com.br</p>
                <span class="sub-text">Respondemos em até 24h</span>
            </div>

            <div class="glass-card contact-card">
                <div class="icon">📍</div>
                <h3>Localização</h3>
                <p>Descalvado — SP</p>
                <span class="sub-text">Interior de São Paulo</span>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="main.js"></script>
</body>
</html>
