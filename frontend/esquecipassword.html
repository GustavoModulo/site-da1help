<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da1Help. — Recuperar Senha</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body { display: flex; flex-direction: column; }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .glass-form { text-align: center; }
        .success-state { display: none; text-align: center; padding: 20px 0; }
        .success-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .success-state h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .success-state p { color: var(--gray-500); font-size: .95rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="glass-header">
        <div class="nav-container">
            <a href="homepage.html" class="logo">Da1Help<span>.</span></a>
            <div style="display:flex;align-items:center;gap:8px">
                <button onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
                <nav class="user-menu">
                    <a href="loginpage.html" class="btn-ghost">← Voltar ao login</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="glass-form">
            <div id="form-state">
                <div style="font-size:2.5rem;margin-bottom:16px">🔑</div>
                <h2>Recuperar Senha</h2>
                <p>Informe seu e-mail e enviaremos as instruções.</p>

                <form id="form-forgot">
                    <div class="input-group">
                        <label for="email">E-mail cadastrado</label>
                        <input type="email" id="email" placeholder="nome@exemplo.com" required autocomplete="email">
                    </div>
                    <button type="submit" id="btn-enviar" class="btn-submit">Enviar Instruções</button>
                    <p class="switch-auth"><a href="loginpage.html">Lembrei a senha</a></p>
                </form>
            </div>

            <div class="success-state" id="success-state">
                <div class="icon">📬</div>
                <h3>Instruções enviadas!</h3>
                <p>Se o e-mail estiver cadastrado, você receberá as instruções para redefinir sua senha em breve.</p>
                <a href="loginpage.html" class="btn-primary" style="margin-top:24px;display:inline-flex">Voltar ao login</a>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="main.js"></script>
    <script>
        document.getElementById('form-forgot').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn   = document.getElementById('btn-enviar');
            const email = document.getElementById('email').value.trim();

            btn.textContent = 'Enviando...';
            btn.disabled    = true;

            try {
                await API.auth.forgotPassword({ email });
                document.getElementById('form-state').style.display    = 'none';
                document.getElementById('success-state').style.display = 'block';
            } catch (_) {
                // Exibe sucesso mesmo em erro para não vazar se email existe
                document.getElementById('form-state').style.display    = 'none';
                document.getElementById('success-state').style.display = 'block';
            }
        });
    </script>
</body>
</html>
