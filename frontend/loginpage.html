<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da1Help. — Entrar</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body { display: flex; flex-direction: column; }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .glass-form { text-align: center; }
        .glass-form h2 { font-size: 2rem; font-weight: 800; color: var(--gray-900); margin-bottom: 6px; letter-spacing: -1px; }
        .glass-form > p { color: var(--gray-500); margin-bottom: 32px; }
        .logo-badge { display: inline-block; font-size: .8rem; font-weight: 700; background: var(--brand-blue-lt); color: var(--brand-blue); padding: 5px 14px; border-radius: 20px; margin-bottom: 20px; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--gray-400); font-size: .85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="glass-header">
        <div class="nav-container">
            <a href="homepage.html" class="logo">Da1Help<span>.</span></a>
            <div style="display:flex;align-items:center;gap:8px">
                <button onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
                <nav class="user-menu">
                    <a href="registerpage.html" class="btn-primary">Criar conta</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="glass-form">
            <span class="logo-badge">Bem-vindo de volta 👋</span>
            <h2>Entrar na plataforma</h2>
            <p>Acesse sua conta para continuar.</p>

            <form id="form-login">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="nome@exemplo.com" required autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <a href="esquecipassword.html" class="forgot-link">Esqueceu a senha?</a>

                <button type="submit" id="btn-login" class="btn-submit">Entrar na Plataforma</button>
                <p class="switch-auth">Novo por aqui? <a href="registerpage.html">Crie sua conta grátis</a></p>
            </form>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="main.js"></script>
    <script>
        // Redireciona se já estiver logado
        if (Session.isLoggedIn()) window.location.href = 'perfil.html';

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn   = document.getElementById('btn-login');
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('password').value;

            btn.textContent = 'Entrando...';
            btn.disabled    = true;

            try {
                const data = await API.auth.login({ email, senha });

                // Salva token JWT e dados do usuário (sem senha)
                Session.save(data.token, data.user);

                Toast.success('Login realizado! Redirecionando...');
                setTimeout(() => {
                    window.location.href = data.user.tipo === 'admin' ? 'admin.html' : 'perfil.html';
                }, 800);
            } catch (err) {
                Toast.error(err.message || 'Email ou senha incorretos.');
                btn.textContent = 'Entrar na Plataforma';
                btn.disabled    = false;
            }
        });
    </script>
</body>
</html>
