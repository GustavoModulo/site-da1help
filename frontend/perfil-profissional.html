<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da1Help. — Perfil Profissional</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { display: flex; flex-direction: column; }
        .main-content { max-width: 860px; margin: 0 auto; padding: 60px 24px 80px; width: 100%; }

        .prof-banner { height: 220px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: linear-gradient(135deg, #1e3a8a, #7c3aed); position: relative; overflow: hidden; }
        #prof-banner-img { position:absolute;inset:0;z-index:1; }
        .prof-header { background: rgba(255,255,255,.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.9); border-radius: 0 0 var(--radius-xl) var(--radius-xl); padding: 0 32px 28px; }
        body.dark-mode .prof-header { background: rgba(26,26,46,.85); border-color: rgba(255,255,255,.07); }
        .prof-photo { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; position: relative; top: -48px; box-shadow: var(--shadow-md); margin-bottom: -28px; }
        .prof-name  { font-size: 1.6rem; font-weight: 800; color: var(--gray-900); }
        .prof-cat   { color: var(--gray-500); font-size: .9rem; margin-top: 3px; }
        .prof-row   { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }

        .stars-display { color: #f59e0b; font-size: 1.1rem; }
        .rating-text  { font-size: .85rem; color: var(--gray-500); margin-left: 6px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
        .info-card { background: var(--gray-50); border-radius: var(--radius-md); padding: 16px 20px; border: 1px solid var(--gray-200); }
        .info-card label { font-size: .78rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 5px; }
        .info-card p { font-size: .95rem; font-weight: 600; color: var(--gray-900); }

        .section-title { font-size: 1.1rem; font-weight: 800; color: var(--gray-900); margin: 32px 0 16px; }

        /* Avaliações */
        .avaliacoes-list { display: flex; flex-direction: column; gap: 14px; }
        .avaliacao-item { padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--gray-200); background: var(--gray-50); }
        .aval-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .aval-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .aval-name  { font-weight: 700; font-size: .92rem; }
        .aval-date  { font-size: .78rem; color: var(--gray-400); margin-left: auto; }
        .aval-stars { color: #f59e0b; font-size: .95rem; margin-bottom: 6px; }
        .aval-text  { font-size: .88rem; color: var(--gray-500); line-height: 1.6; }

        /* Ações */
        .action-bar { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-wa:hover { background: #1da851; }

        /* Stars modal */
        .stars-row { display: flex; flex-direction: row-reverse; gap: 8px; justify-content: flex-end; margin: 16px 0; }
        .stars-row input { display: none; }
        .stars-row label { font-size: 2.4rem; cursor: pointer; color: var(--gray-200); transition: color .1s; }
        .stars-row input:checked ~ label,
        .stars-row label:hover,
        .stars-row label:hover ~ label { color: #f59e0b; }

        .motivo-select { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-200); font-size: .95rem; font-family: inherit; outline: none; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="glass-header">
        <div class="nav-container">
            <a href="homepage.html" class="logo">Da1Help<span>.</span></a>
            <div style="display:flex;align-items:center;gap:14px">
                <button onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
                <nav class="user-menu">
                    <a href="searchpage.html" class="nav-link">← Voltar</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Banner -->
        <div id="prof-banner" class="prof-banner"><img id="prof-banner-img" style="width:100%;height:100%;object-fit:cover;display:none" alt="Banner"></div>
        <div class="prof-header glass-card" style="border-radius:0 0 var(--radius-xl) var(--radius-xl)">
            <div class="prof-row">
                <img id="prof-photo" src="images/Default_FotoPerfil.png" alt="Foto" class="prof-photo">
                <div style="flex:1">
                    <h1 id="prof-name" class="prof-name">Carregando...</h1>
                    <div id="prof-cat" class="prof-cat"></div>
                    <div style="display:flex;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px">
                        <span id="prof-stars" class="stars-display"></span>
                        <span id="prof-rating-text" class="rating-text"></span>
                        <span id="badge-pat" style="display:none" class="badge-patrocinado">✓ Verificado</span>
                    </div>
                </div>
            </div>
            <div class="info-grid" id="info-grid"></div>
        </div>

        <!-- Descrição -->
        <h2 class="section-title">Sobre o Profissional</h2>
        <div class="glass-card" style="padding:24px">
            <p id="prof-descricao" style="color:var(--gray-600);line-height:1.7;font-size:.95rem">Carregando...</p>
        </div>

        <!-- Ações -->
        <div class="action-bar" id="action-bar">
            <button onclick="abrirAvaliacao()" class="btn-primary">⭐ Avaliar</button>
            <button onclick="abrirDenuncia()" class="btn-secondary">🚨 Denunciar</button>
            <a id="btn-chat" href="#" class="btn-ghost">💬 Enviar Mensagem</a>
        </div>

        <!-- Avaliações -->
        <h2 class="section-title">Avaliações</h2>
        <div id="avaliacoes-lista" class="avaliacoes-list">
            <div class="empty-state"><div class="empty-icon">💬</div><p>Nenhuma avaliação ainda.</p></div>
        </div>
    </main>

    <!-- Modal Avaliação -->
    <div id="modal-avaliacao" class="modal-overlay">
        <div class="modal-box">
            <h3>⭐ Avaliar Profissional</h3>
            <p style="color:var(--gray-500);font-size:.9rem;margin-bottom:4px">Selecione uma nota:</p>
            <div class="stars-row">
                <input type="radio" name="rate" id="s5" value="5"><label for="s5">★</label>
                <input type="radio" name="rate" id="s4" value="4"><label for="s4">★</label>
                <input type="radio" name="rate" id="s3" value="3"><label for="s3">★</label>
                <input type="radio" name="rate" id="s2" value="2"><label for="s2">★</label>
                <input type="radio" name="rate" id="s1" value="1"><label for="s1">★</label>
            </div>
            <div class="input-group">
                <label>Comentário <small style="color:var(--gray-400)">(opcional, público)</small></label>
                <textarea id="texto-avaliacao" rows="3" placeholder="Descreva sua experiência..."></textarea>
            </div>
            <div style="display:flex;gap:10px;margin-top:8px">
                <button id="btn-enviar-aval" class="btn-submit" style="margin:0">Enviar Avaliação</button>
                <button onclick="fecharModais()" class="btn-secondary" style="flex:0;white-space:nowrap">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Denúncia -->
    <div id="modal-denuncia" class="modal-overlay">
        <div class="modal-box">
            <h3>🚨 Denunciar Perfil</h3>
            <select id="motivo-denuncia" class="motivo-select">
                <option value="perfil_falso">Perfil falso / identidade falsa</option>
                <option value="fraude">Fraude ou golpe</option>
                <option value="comportamento_abusivo">Comportamento abusivo</option>
                <option value="servico_nao_entregue">Serviço não entregue</option>
                <option value="conteudo_inapropriado">Conteúdo inapropriado</option>
                <option value="outro">Outro motivo</option>
            </select>
            <div class="input-group">
                <label>Descrição</label>
                <textarea id="texto-denuncia" rows="4" placeholder="Descreva detalhadamente o ocorrido..."></textarea>
            </div>
            <div style="display:flex;gap:10px;margin-top:8px">
                <button id="btn-enviar-den" class="btn-danger" style="flex:1;padding:13px">Enviar Denúncia</button>
                <button onclick="fecharModais()" class="btn-secondary" style="flex:0;white-space:nowrap">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const profId    = urlParams.get('id');
        if (!profId) window.location.href = 'searchpage.html';

        function renderStarsDisplay(nota) {
            const n = Math.round(nota || 0);
            return '★'.repeat(n) + '☆'.repeat(5 - n);
        }

        async function carregarPerfil() {
            try {
                const data = await API.users.getProfissional(profId);
                const p    = data.profissional;
                const prof = p.profissional || {};

                document.title = `Da1Help. — ${p.nome}`;

                const fotoUrl = p.fotoUrl && !p.fotoUrl.includes('Default')
                    ? p.fotoUrl
                    : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.nome)}&background=1d4ed8&color=fff&bold=true&size=128`;

                document.getElementById('prof-photo').src  = fotoUrl;

                // Carrega banner
                if (prof.banner) {
                    const bImg = document.getElementById('prof-banner-img');
                    if (bImg) { bImg.src = prof.banner; bImg.style.display = 'block'; }
                }
                document.getElementById('prof-name').textContent = p.nome;
                const catArr = Array.isArray(prof.categoria) ? prof.categoria : (prof.categoria ? [prof.categoria] : []);
                document.getElementById('prof-cat').textContent = catArr.join(' · ') || '';
                document.getElementById('prof-descricao').textContent = prof.descricao || 'Sem descrição.';

                const nota  = prof.avaliacao || 0;
                const total = prof.totalAvaliacoes || 0;
                document.getElementById('prof-stars').textContent       = renderStarsDisplay(nota);
                document.getElementById('prof-rating-text').textContent = nota ? `${nota.toFixed(1)} (${total} avaliação${total !== 1 ? 'ões' : ''})` : 'Sem avaliações';

                if (prof.isPatrocinado) document.getElementById('badge-pat').style.display = 'inline';

                // Info grid
                const infoGrid = document.getElementById('info-grid');
                infoGrid.innerHTML = `
                    ${prof.whatsapp ? `<div class="info-card"><label>WhatsApp</label><p><a href="https://wa.me/${prof.whatsapp}" target="_blank" style="color:var(--brand-blue);text-decoration:none">📞 ${prof.whatsapp}</a></p></div>` : ''}
                    ${prof.cidade   ? `<div class="info-card"><label>Cidade</label><p>📍 ${prof.cidade}</p></div>` : ''}
                    ${prof.tipoServico ? `<div class="info-card"><label>Modalidade</label><p>${prof.tipoServico === 'presencial' ? '🏠 Presencial' : prof.tipoServico === 'remoto' ? '💻 Remoto' : '🔄 Presencial e Remoto'}</p></div>` : ''}
                    ${prof.redesSociais?.instagram ? `<div class="info-card"><label>Instagram</label><p><a href="https://instagram.com/${prof.redesSociais.instagram}" target="_blank" style="color:var(--brand-blue);text-decoration:none">@${prof.redesSociais.instagram}</a></p></div>` : ''}
                `;

                // Botão chat
                document.getElementById('btn-chat').href = `chat.html?id=${p._id}`;

                // Carrega avaliações
                carregarAvaliacoes();

            } catch (err) {
                Toast.error('Erro ao carregar perfil.');
                setTimeout(() => window.location.href = 'searchpage.html', 1500);
            }
        }

        async function carregarAvaliacoes() {
            try {
                const data  = await API.users.getAvaliacoes(profId);
                const lista = document.getElementById('avaliacoes-lista');

                if (!data.avaliacoes.length) {
                    lista.innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div><p>Nenhuma avaliação ainda. Seja o primeiro a avaliar!</p></div>`;
                    return;
                }

                lista.innerHTML = data.avaliacoes.map(a => {
                    const cliente   = a.clienteId || {};
                    const avatarUrl = cliente.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(cliente.nome || 'U')}&background=e5e7eb&color=374151&bold=true`;
                    const data_fmt  = new Date(a.createdAt).toLocaleDateString('pt-BR');
                    return `
                        <div class="avaliacao-item">
                            <div class="aval-header">
                                <img src="${avatarUrl}" alt="Avatar" class="aval-avatar">
                                <span class="aval-name">${cliente.nome || 'Usuário'}</span>
                                <span class="aval-date">${data_fmt}</span>
                            </div>
                            <div class="aval-stars">${'★'.repeat(a.nota)}${'☆'.repeat(5 - a.nota)}</div>
                            ${a.comentario ? `<p class="aval-text">${a.comentario}</p>` : ''}
                        </div>`;
                }).join('');
            } catch (_) {}
        }

        // ─── Modais ───────────────────────────────────────────────────────────
        function abrirAvaliacao() {
            if (!Session.isLoggedIn()) { Toast.warning('Faça login para avaliar.'); return; }
            document.getElementById('modal-avaliacao').classList.add('active');
        }
        function abrirDenuncia() {
            if (!Session.isLoggedIn()) { Toast.warning('Faça login para denunciar.'); return; }
            document.getElementById('modal-denuncia').classList.add('active');
        }
        function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', (e) => { if (e.target === m) fecharModais(); }));

        document.getElementById('btn-enviar-aval').addEventListener('click', async () => {
            const estrela = document.querySelector('input[name="rate"]:checked');
            if (!estrela) { Toast.warning('Selecione uma nota.'); return; }
            const btn = document.getElementById('btn-enviar-aval');
            btn.textContent = 'Enviando...'; btn.disabled = true;
            try {
                await API.users.avaliar(profId, {
                    nota:       Number(estrela.value),
                    comentario: document.getElementById('texto-avaliacao').value.trim(),
                });
                Toast.success('Avaliação enviada!');
                fecharModais();
                carregarPerfil();
            } catch (err) {
                Toast.error(err.message);
            } finally {
                btn.textContent = 'Enviar Avaliação'; btn.disabled = false;
            }
        });

        document.getElementById('btn-enviar-den').addEventListener('click', async () => {
            const descricao = document.getElementById('texto-denuncia').value.trim();
            if (!descricao) { Toast.warning('Descreva o motivo.'); return; }
            const btn = document.getElementById('btn-enviar-den');
            btn.textContent = 'Enviando...'; btn.disabled = true;
            try {
                await API.users.denunciar(profId, {
                    motivo:    document.getElementById('motivo-denuncia').value,
                    descricao,
                });
                Toast.success('Denúncia registrada!');
                fecharModais();
            } catch (err) {
                Toast.error(err.message);
            } finally {
                btn.textContent = 'Enviar Denúncia'; btn.disabled = false;
            }
        });

        carregarPerfil();
    </script>
</body>
</html>
